# This is a Declarative Automation Bundle definition for bakehouse_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehouse_analytics
  uuid: ac8502e2-cbb2-46b7-87e0-85cb1cd0e068

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-c81e9c19-ded2.cloud.databricks.com
    variables:
      catalog: bakehouse_analytics_dev
      schema: rnd
  prod:
    mode: production
    presets:
      name_prefix: prod_
    workspace:
      host: https://dbc-c81e9c19-ded2.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/abhishek.mallick03@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/abhishek.mallick03@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bakehouse_analytics_prod
      schema: prod
    permissions:
      - user_name: abhishek.mallick03@gmail.com
        level: CAN_MANAGE
